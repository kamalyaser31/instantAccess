[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instantAccess"
dynamic = ["version"]
description = "Quick access and action automation add-on for NVDA"
maintainers = [
	{name = "Kamal Yaser", email = "kamalyaser31@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.TXT"}
# This package is not installed as a library; every dependency is tooling used to
# build, translate, or lint the add-on. They are declared as PEP 735 dependency groups.
dependencies = []
[project.urls]
Repository = "https://github.com/kamalyaser31/instantAccess"

[tool.setuptools.packages.find]
include = ["addon*"]

# PEP 735 dependency groups. `uv sync` installs the `dev` group by default, which
# pulls in every tool needed to build, translate, and lint the add-on.
[dependency-groups]
# Build add-on
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
# Translations management
l10n = [
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
# Lint
lint = [
	"ruff==0.14.5",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
	{ include-group = "lint" },
]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
	"tests",
	"addon/globalPlugins/core/keyboard",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]
